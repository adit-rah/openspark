name: Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: |
          node serve.mjs 8080 &
          sleep 1
          npm test
